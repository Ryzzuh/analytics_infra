[project]
name = "loader"
version = "0.1.0"
description = "Micro-batch loader: offset ledger, deterministic range reads, replace-on-rerun"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]
