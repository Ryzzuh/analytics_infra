[project]
name = "drift"
version = "0.1.0"
description = "Schema-drift detection for schemaless event payloads"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]
