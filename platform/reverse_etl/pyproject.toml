[project]
name = "reverse-etl"
version = "0.1.0"
description = "Activation: sync modelled account health back to the product"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_etl"]
