version: 2

sources:
  - name: raw
    schema: raw
    description: Loader-owned, append-only. Never written by dbt.
    tables:
      - name: product_events
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 15, period: minute}
          error_after: {count: 60, period: minute}
      - name: cdc_changes
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 30, period: minute}
      - name: oltp_snapshots
        description: Independent daily snapshot of source state; never derived from CDC.

  - name: ops
    schema: ops
    description: Platform bookkeeping.
    tables:
      - name: cdc_gaps

models:
  - name: stg_subscription_changes
    description: Typed, redelivery-deduplicated subscription change log.
    meta:
      required_fields: [status, plan_code, seats, mrr_cents]
    columns:
      - name: subscription_id
        tests: [not_null]
      - name: source_lsn
        tests: [not_null]
      - name: op
        tests:
          - accepted_values:
              arguments:
                values: ['c', 'u', 'd', 'r']

  - name: stg_product_events_quarantined
    description: >
      Live events held back by the lateness cutoff. Feeds the quarantine-rate metric and the
      Console; absorbed into staging only by an explicit full refresh.
    columns:
      - name: event_id
        tests: [not_null]

  - name: stg_product_events
    description: >
      Typed and deduplicated product events. One row per event_id, keeping the first arrival.
    meta:
      lateness_tolerance_days: 3
      # Fields this model depends on. The drift detector reads this from manifest.json, so a
      # field disappearing upstream fails THIS model rather than silently zeroing a mart
      # (SPEC.md §7).
      required_fields: [feature, surface, plan, duration_ms]
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: event_type
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: duplicate_copies
        description: How many additional copies of this event arrived. Feeds the dup-rate metric.
