name: analytics_infra
version: 0.1.0
config-version: 2
profile: analytics_infra

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"

vars:
  # Default lateness tolerance; individual models override via meta (SPEC.md §6.2).
  lookback_days: 3
  # The date spine starts here. Must predate the oldest history the backfill seeds (M4),
  # or daily facts silently lose their earliest days.
  spine_start_date: '2025-01-01'

models:
  analytics_infra:
    staging:
      +schema: staging
      +materialized: incremental
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
