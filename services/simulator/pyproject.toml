[project]
# Distribution name is namespaced; the IMPORT name is unchanged.
#
# Every short name here (loader, dq, drift, collector, simulator, opsctl...) is taken on PyPI by
# something unrelated. A plain `pip install ./services/simulator` inside a Docker image resolved
# the bare dependency `loader` to a stranger's 2017 package and shadowed ours — the container
# built and ran, and every import of our code silently got somebody else's.
name = "analytics-simulator"
version = "0.1.0"
description = "Synthetic SaaS product: users, sessions and feature usage"
requires-python = ">=3.12"
# psycopg is declared directly, not leaned on transitively through analytics-loader:
# simulator.oltp and simulator.oltp_main import it themselves, and a dependency you import
# should be one you declare — otherwise a change to the loader's own dependencies silently
# breaks this package.
dependencies = [
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "analytics-loader",
]

[project.scripts]
simulator = "simulator.main:main"
simulator-oltp = "simulator.oltp_main:main"
simulator-history = "simulator.history_cli:main"

[tool.uv.sources]
analytics-loader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]
