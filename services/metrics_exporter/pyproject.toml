[project]
name = "metrics-exporter"
version = "0.1.0"
description = "Exports the platform's own health from the warehouse ops schema to Prometheus"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "psycopg[binary]>=3.2", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_exporter"]
