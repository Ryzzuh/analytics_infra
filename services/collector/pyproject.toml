[project]
name = "collector"
version = "0.1.0"
description = "HTTP event collector: validates the envelope, produces to Redpanda"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "confluent-kafka>=2.5",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]
