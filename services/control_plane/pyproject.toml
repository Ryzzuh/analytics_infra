[project]
# Distribution name is namespaced; the IMPORT name is unchanged.
#
# Every short name here (loader, dq, drift, collector, simulator, opsctl...) is taken on PyPI by
# something unrelated. A plain `pip install ./services/simulator` inside a Docker image resolved
# the bare dependency `loader` to a stranger's 2017 package and shadowed ours — the container
# built and ran, and every import of our code silently got somebody else's.
name = "analytics-control-plane"
version = "0.1.0"
description = "The Platform Console's API: status, pipeline runs, chaos scenarios, reset"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "analytics-opsctl",
]

[tool.uv.sources]
analytics-opsctl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
