[project]
name = "control-plane"
version = "0.1.0"
description = "The Platform Console's API: status, pipeline runs, chaos scenarios, reset"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "opsctl",
]

[tool.uv.sources]
opsctl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
