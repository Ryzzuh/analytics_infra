[project]
name = "app-api"
version = "0.1.0"
description = "The synthetic SaaS product's API: receives churn insights, shows them to users"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "psycopg[binary]>=3.2", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_api"]
