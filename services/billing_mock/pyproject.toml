[project]
name = "billing-mock"
version = "0.1.0"
description = "Stripe-shaped billing provider with realistic unreliability"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_mock"]
