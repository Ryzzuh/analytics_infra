# Template for secrets/prod.yaml, which is sops-encrypted and committed.
#
#   cp secrets/prod.example.yaml secrets/prod.yaml
#   $EDITOR secrets/prod.yaml
#   make secrets-encrypt
#
# Never commit secrets/prod.yaml unencrypted: `make secrets-check` fails the build if it finds
# plaintext, and .gitignore does not cover it on purpose — a file that is ignored is a file
# nobody notices is missing.
hcloud_token: replace-me
warehouse_password: replace-me
app_db_password: replace-me
airflow_api_token: replace-me
telegram_bot_token: replace-me
telegram_chat_id: "0"
demo_passcode_hash: replace-me  # caddy hash-password --plaintext '<passcode>'
ghcr_token: replace-me
