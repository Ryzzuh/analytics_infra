[project]
name = "analytics-infra"
version = "0.1.0"
description = "End-to-end analytics platform demo (see SPEC.md)"
requires-python = ">=3.12,<3.13"
dependencies = ["loader", "collector", "simulator", "opsctl"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pgserver>=0.1.4",
    "ruff>=0.7",
    "dbt-postgres>=1.8",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["platform/loader", "platform/opsctl", "services/collector", "services/simulator"]

[tool.uv.sources]
loader = { workspace = true }
collector = { workspace = true }
simulator = { workspace = true }
opsctl = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dbt: runs dbt against the embedded Postgres"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
