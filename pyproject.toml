[project]
name = "analytics-infra"
version = "0.1.0"
description = "End-to-end analytics platform demo (see SPEC.md)"
requires-python = ">=3.12,<3.13"
dependencies = ["loader"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pgserver>=0.1.4",
    "ruff>=0.7",
]

[tool.uv.workspace]
members = ["platform/loader", "services/collector", "services/simulator"]

[tool.uv.sources]
loader = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
