[project]
name = "analytics-infra"
version = "0.1.0"
description = "End-to-end analytics platform demo (see SPEC.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "analytics-loader",
    "analytics-collector",
    "analytics-simulator",
    "analytics-opsctl",
    "analytics-reverse-etl",
    "analytics-dq",
    "analytics-drift",
    "analytics-billing-mock",
    "analytics-app-api",
    "analytics-metrics-exporter",
    "analytics-alert-bridge",
    "analytics-control-plane",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pgserver>=0.1.4",
    "ruff>=0.7",
    "dbt-postgres>=1.8",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = [
    "platform/loader",
    "platform/opsctl",
    "platform/reverse_etl",
    "platform/dq",
    "platform/drift",
    "services/collector",
    "services/simulator",
    "services/billing_mock",
    "services/app_api",
    "services/metrics_exporter",
    "services/alert_bridge",
    "services/control_plane",
]

[tool.uv.sources]
analytics-loader = { workspace = true }
analytics-collector = { workspace = true }
analytics-simulator = { workspace = true }
analytics-opsctl = { workspace = true }
analytics-reverse-etl = { workspace = true }
analytics-dq = { workspace = true }
analytics-drift = { workspace = true }
analytics-billing-mock = { workspace = true }
analytics-app-api = { workspace = true }
analytics-metrics-exporter = { workspace = true }
analytics-alert-bridge = { workspace = true }
analytics-control-plane = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dbt: runs dbt against the embedded Postgres"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented idiom is calling these in argument defaults; B008 is a false positive
# for them, and working around it would make the endpoint signatures worse.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Depends",
]
