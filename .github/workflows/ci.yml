name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Postgres comes from pgserver (embedded real PostgreSQL), so no service container is
      # needed and the same command runs identically on a laptop.
      - run: uv run pytest -q

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves each alert fires on its condition AND stays quiet on the near misses. Reviewing
      # the YAML cannot establish either.
      - name: Install promtool and amtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz | tar xz
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-3.6.0.linux-amd64/promtool alertmanager-0.28.1.linux-amd64/amtool /usr/local/bin/
      - run: promtool check config infra/monitoring/prometheus.yml
      - run: promtool test rules rules_test.yml
        working-directory: infra/monitoring
      - run: amtool check-config infra/monitoring/alertmanager.yml

  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Catches the most common breakage: a DAG that fails to import, or a cycle. Airflow is
      # installed only here, so the fast test job stays light.
      # Same version the image pins, so a DAG that parses here parses there. (Locally this
      # job can only run on 3.0.3: newer Airflow needs libcst >= 1.8.2, which ships no
      # x86_64-macOS wheel.)
      - run: pip install "apache-airflow==3.2.2" "astronomer-cosmos>=1.15" "dbt-postgres>=1.8" ./platform/loader
      - name: Build the dbt manifest the transform DAG renders from
        run: cd dbt && dbt parse --profiles-dir . --project-dir . --target local
      - name: DagBag import check
        env:
          WAREHOUSE_DSN: postgresql://unused
          APP_DSN: postgresql://unused
          DBT_PROJECT_DIR: dbt
          DBT_MANIFEST_PATH: dbt/target/manifest.json
        run: |
          python - <<'PY'
          from airflow.models.dagbag import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert bag.dags, "no DAGs found"
          # The Cosmos-rendered DAG must have real tasks: an empty render means the manifest
          # was missing or stale, which would otherwise pass as "imported fine".
          transform = bag.dags["transform"]
          assert len(transform.tasks) > 10, f"transform rendered only {len(transform.tasks)} tasks"
          print(f"{len(bag.dags)} DAG(s) imported cleanly; transform has {len(transform.tasks)} tasks")
          PY
