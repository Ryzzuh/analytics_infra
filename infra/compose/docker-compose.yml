# Core profile (SPEC.md §2): the M1 slice, sized for a laptop.
# Services tagged `profiles: [full]` are the VM's extras and are excluded from `make up`.
name: analytics-infra

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # These three were invisible under `airflow standalone`, which ran every component in one
  # process and generated both secrets on the fly. Split across containers, each process would
  # generate its own: the scheduler's task workers authenticate to the api-server's Task
  # Execution API with a JWT, so mismatched secrets mean every task fails to start, and a
  # per-container Fernet key makes stored connections undecryptable by the process that did not
  # write them. Local development values — the deployed instance overrides both from sops
  # (SPEC.md §13).
  # At least 64 bytes: these JWTs are signed with HS512, and a shorter key is below the length
  # RFC 7518 §3.2 requires for SHA-512. Airflow logs it as a warning and carries on, so a 44
  # byte secret works — it is simply weaker than the algorithm assumes.
  AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-2PY2ALaXhyETcM0W/KsmMqB+IP8wCejVZcshWLp/PSWwi+XPr9tV/tnKD1Ltdr3wt4vZ7zoUGOKP9SjtZIJOjw==}"
  AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-avFYvwAZICvOKtc0ydBJGufH4dwWpm5dWw68FpZuYW4=}"
  # Where the scheduler's workers reach the Task Execution API. The default points at
  # localhost, which is correct only when everything shares one container.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow:8080/execution/
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__METRICS__STATSD_ON: "true"
  AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
  AIRFLOW__METRICS__STATSD_PORT: "8125"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
  WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres-warehouse:5432/warehouse
  APP_DSN: postgresql://app:app@postgres-app:5432/app
  REDPANDA_BOOTSTRAP: redpanda:9092
  BILLING_API_URL: http://billing-mock:8001
  APP_API_URL: http://app-api:8003

# Airflow, as four supervised containers rather than one `standalone` process.
#
# standalone runs scheduler, api-server, triggerer and dag-processor as child processes and
# supervises none of them. A brief DNS failure while postgres-airflow was recreated killed the
# scheduler and dag-processor; the container stayed `Up`, the triggerer kept logging every
# 60s, and no DAG ran for twenty minutes without a single signal that anything was wrong.
# Docker's restart policy could not help, because the container never exited.
#
# Split out, each component is a container Docker can see die and restart on its own. That is
# the whole reason for the extra ~1.2 GB of resident memory: four Airflow processes instead of
# one process tree. It is why the laptop profile could not have this.
x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.airflow
  environment: *airflow-env
  volumes:
    - ../../airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped


services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      # Auto-creation off: with it on, the first produce silently creates the topic with ONE
      # partition, which quietly discards the 6-partition layout redpanda-init configures and
      # turns a typo'd topic name into a new topic rather than an error. Found by running it —
      # the stack looked fine and product.session had one partition.
      - --set redpanda.auto_create_topics_enabled=false
    ports: ["19092:19092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: ["redpanda-data:/var/lib/redpanda/data"]

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    # Topics are created explicitly rather than auto-created on first produce, so partition
    # count and retention are a deliberate choice rather than a default.
    #
    # The CDC topics have to be here for the same reason. Disabling broker auto-create (so a
    # typo could not silently make a 1-partition topic) also stopped anything from creating
    # Debezium's destination topics: the connector then reports RUNNING while every produce
    # fails with UNKNOWN_TOPIC_OR_PARTITION and the replication slot retains WAL indefinitely.
    # Three partitions rather than six — CDC volume is far below product events, and ordering
    # that matters is per-key within a table, which Debezium's PK keying already guarantees.
    # The heartbeat topic carries one key and gets one partition.
    command: >
      'for t in session feature_usage lifecycle billing_ui; do
         rpk topic create product.$$t -p 6 -r 1 --brokers redpanda:9092 || true;
         rpk topic create product.$$t.backfill -p 6 -r 1 --brokers redpanda:9092
           -c retention.ms=43200000 || true;
       done;
       rpk topic create billing.webhooks -p 3 -r 1 --brokers redpanda:9092 || true;
       for t in accounts users plans subscriptions invoices support_tickets; do
         rpk topic create cdc.app.public.$$t -p 3 -r 1 --brokers redpanda:9092 || true;
       done;
       rpk topic create __debezium-heartbeat.cdc.app -p 1 -r 1 --brokers redpanda:9092 || true'
    restart: "no"

  postgres-warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=2GB
    ports: ["5433:5432"]
    healthcheck:
      # -h 127.0.0.1 forces the check over TCP. Without it pg_isready uses the unix socket,
      # which answers during first-run initdb while the server is still socket-only — so the
      # container reports healthy, dependents start, and their TCP connections are refused.
      # Only ever visible on a fresh volume, which is why it survived every run on an
      # already-initialised database.
      test: ["CMD-SHELL", "pg_isready -U warehouse -h 127.0.0.1"]
      interval: 5s
      retries: 10
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ../../db/warehouse/ddl:/ddl:ro

  warehouse-init:
    image: postgres:16-alpine
    depends_on:
      postgres-warehouse: {condition: service_healthy}
    environment:
      PGPASSWORD: warehouse
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'for f in /ddl/*.sql; do
         psql -h postgres-warehouse -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f "$$f";
       done'
    volumes: ["../../db/warehouse/ddl:/ddl:ro"]
    restart: "no"

  # The source OLTP database. Separate server from the warehouse, not just a separate
  # database: WAL is written per SERVER, so a Debezium slot here would otherwise also hold
  # back the warehouse's COPY traffic and the slot-fill scenario would behave nothing like
  # production (SPEC.md §2).
  postgres-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      # The cap that protects the shared disk: past it Postgres invalidates the slot and CDC
      # breaks, rather than WAL growing until every service on the box stops (SPEC.md §9.1).
      - -c
      - max_slot_wal_keep_size=5GB
      - -c
      - shared_buffers=256MB
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -h 127.0.0.1"]
      interval: 5s
      retries: 10
    volumes:
      - app-data:/var/lib/postgresql/data
      - ../../db/app/ddl:/ddl:ro

  app-init:
    image: postgres:16-alpine
    depends_on:
      postgres-app: {condition: service_healthy}
    environment:
      PGPASSWORD: app
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'for f in /ddl/*.sql; do
         psql -h postgres-app -U app -d app -v ON_ERROR_STOP=1 -f "$$f";
       done'
    volumes: ["../../db/app/ddl:/ddl:ro"]
    restart: "no"

  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      redpanda: {condition: service_healthy}
      postgres-app: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: analytics-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      APP_DB_USER: app
      APP_DB_PASSWORD: app
      # Connect does NOT resolve ${env:...} in a connector config unless the worker declares a
      # provider for it. Without this it passes the literal string "${env:APP_DB_USER}" as the
      # username, and the connector fails validation with a password-authentication error that
      # names the placeholder — which is at least an honest error message.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      # Explicit allowlist: the provider can otherwise read every variable in the worker's
      # environment, and a connector config is retrievable over the REST API.
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: "APP_DB_.*"
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      retries: 10

  # Airflow's own metadata DB is separate from the warehouse on purpose: its write churn must
  # not compete with loads, and WAL settings for CDC (M2) must not be dictated by Airflow.
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    command: [postgres, -c, shared_buffers=128MB]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -h 127.0.0.1"]
      interval: 5s
      retries: 10
    volumes: ["airflow-data:/var/lib/postgresql/data"]

  # Schema migration runs once, in its own container, so four components do not race to migrate
  # the same database on a cold start.
  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres-airflow: {condition: service_healthy}
    command: ["db", "migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    # Reachable as `airflow` so the Caddyfile, the control plane and AIRFLOW_URL keep working:
    # renaming the service should not mean rewriting every consumer of its hostname.
    networks:
      default:
        aliases: [airflow]
    ports: ["8080:8080"]
    command: ["api-server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      postgres-warehouse: {condition: service_healthy}
      postgres-app: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    command: ["scheduler"]
    # The check that was missing: is a scheduler heartbeat still being written? A scheduler that
    # has died now takes its container down with it, and `restart: unless-stopped` brings it
    # back, rather than leaving every DAG unpaused and idle.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  collector:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: collector}
    depends_on:
      redpanda: {condition: service_healthy}
    environment:
      REDPANDA_BOOTSTRAP: redpanda:9092
    command: ["uvicorn", "collector.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      retries: 5

  simulator:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      # The [kafka] extra matters: simulator.storm produces directly to the broker for the
      # chaos scenarios, and without it the import fails only when a scenario runs.
      args: {SERVICE: simulator, PLATFORM_DEPS: "./platform/loader[kafka]"}
    depends_on:
      collector: {condition: service_healthy}
    command: ["simulator"]
    environment:
      COLLECTOR_URL: http://collector:8000
      SIM_ACCOUNTS: "${SIM_ACCOUNTS:-500}"
      SIM_RATE: "${SIM_RATE:-2}"

  # Registering the connector was documented in infra/connect/README.md and done by hand, which
  # meant `make up` produced a stack with no CDC at all: slot absent, topics absent, change log
  # empty. A step the system cannot start without does not belong in prose.
  #
  # PUT .../config (rather than POST /connectors) is the idempotent form: it creates the
  # connector or updates it in place, so re-running this on every `up` converges instead of
  # failing with 409. It takes the bare config object, which is why the JSON file holds exactly
  # that — the {name, config} wrapper the old README posted here is rejected outright.
  connect-init:
    image: curlimages/curl:8.11.1
    depends_on:
      connect: {condition: service_healthy}
    volumes: ["../connect/subscriptions-source.json:/connector.json:ro"]
    # --fail matters: without it curl exits 0 on a 4xx/5xx and a rejected connector config
    # looks exactly like a successful registration.
    command: >
      --fail --silent --show-error -X PUT
      -H "Content-Type: application/json"
      --data @/connector.json
      http://connect:8083/connectors/app-cdc/config
    restart: on-failure

  # The CDC source. Without this the `accounts` and `subscriptions` tables are never written
  # to, so Debezium captures nothing and the whole CDC half of the platform — the change log,
  # SCD2, dim_subscription — runs against a source that never changes. It is a separate
  # container from `simulator` on purpose: that one needs the collector and no database, this
  # one needs the database and no collector, and they should fail independently.
  oltp-simulator:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: simulator, PLATFORM_DEPS: "./platform/loader[kafka]"}
    depends_on:
      postgres-app: {condition: service_healthy}
      app-init: {condition: service_completed_successfully}
    command: ["simulator-oltp"]
    environment:
      APP_DSN: postgresql://app:app@postgres-app:5432/app
      SIM_ACCOUNTS: "${SIM_ACCOUNTS:-500}"
      SIM_OLTP_INTERVAL: "${SIM_OLTP_INTERVAL:-5}"
      SIM_OLTP_TRANSITIONS: "${SIM_OLTP_TRANSITIONS:-3}"
      SIM_OLTP_HISTORY_DAYS: "${SIM_OLTP_HISTORY_DAYS:-0}"

  billing-mock:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: billing_mock}
    environment:
      WEBHOOK_URL: http://webhook-receiver:8002/webhooks/billing
      BILLING_VISIBILITY_LAG_S: "5"
      BILLING_RATE_LIMIT_EVERY: "40"
    command: ["uvicorn", "billing_mock.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      retries: 5

  webhook-receiver:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: webhook_receiver}
    depends_on:
      redpanda: {condition: service_healthy}
    environment:
      REDPANDA_BOOTSTRAP: redpanda:9092
    command: ["uvicorn", "webhook_receiver.app:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8002:8002"]

  app-api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: app_api}
    depends_on:
      postgres-app: {condition: service_healthy}
    environment:
      APP_DSN: postgresql://app:app@postgres-app:5432/app
      INSIGHTS_RATE_LIMIT_PER_MINUTE: "600"
    command: ["uvicorn", "app_api.app:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8003:8003"]

  # --- observability (SPEC.md §10) -----------------------------------------------------
  # In the `full` profile: the laptop core profile has to fit in ~4 GB, and these four add
  # roughly 1.5 GB between them. The VM runs everything.

  metrics-exporter:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: metrics_exporter}
    profiles: [full]
    depends_on:
      postgres-warehouse: {condition: service_healthy}
    environment:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres-warehouse:5432/warehouse
    command: ["uvicorn", "metrics_exporter.app:app", "--host", "0.0.0.0", "--port", "8005"]
    ports: ["8005:8005"]

  alert-bridge:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: alert_bridge}
    profiles: [full]
    environment:
      # Unset locally: the bridge logs what it would have sent rather than failing, so
      # Alertmanager is not left retrying a notification nobody can receive.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    command: ["uvicorn", "alert_bridge.app:app", "--host", "0.0.0.0", "--port", "8004"]
    ports: ["8004:8004"]

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [full]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # 15 days at 30s: enough to see last week's incident, small enough for the box.
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [full]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [full]
    depends_on: [prometheus]
    environment:
      # Anonymous viewing on purpose: the live instance is meant to be browsable without an
      # account, and nothing here is private (SPEC.md §11).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]

  postgres-app-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [full]
    depends_on:
      postgres-app: {condition: service_healthy}
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@postgres-app:5432/app?sslmode=disable
      # Replication-slot metrics are the reason this exporter is here at all (SPEC.md §9.1).
      PG_EXPORTER_INCLUDE_DATABASES: app

  postgres-warehouse-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [full]
    depends_on:
      postgres-warehouse: {condition: service_healthy}
    environment:
      DATA_SOURCE_NAME: postgresql://warehouse:warehouse@postgres-warehouse:5432/warehouse?sslmode=disable

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    profiles: [full]
    command: ["--statsd.listen-udp=:8125", "--web.listen-address=:9102"]

  control-plane:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: control_plane, PLATFORM_DEPS: ./platform/opsctl}
    depends_on:
      postgres-warehouse: {condition: service_healthy}
    environment:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres-warehouse:5432/warehouse
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_API_TOKEN: "${AIRFLOW_API_TOKEN:-}"
      PROMETHEUS_URL: http://prometheus:9090
    # The control plane runs chaos scenarios by acting on the stack, so it needs the docker
    # socket. That is a real privilege: it is why the Airflow token lives here and not in the
    # product app, and why Caddy gates every action route behind the passcode (SPEC.md §11).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../infra/golden/golden.sh:/app/golden.sh:ro
    command: ["uvicorn", "control_plane.app:app", "--host", "0.0.0.0", "--port", "8006"]
    ports: ["8006:8006"]

  caddy:
    image: caddy:2.10-alpine
    profiles: [full]
    depends_on: [control-plane, app-api, grafana]
    environment:
      # These defaults must be *valid*, not merely present. Caddy's `{$VAR:default}` fills in
      # only when a variable is unset, and compose set both of these to "" — so the default
      # never applied: `email` with an empty argument fails to parse, and an empty bcrypt hash
      # fails basicauth provisioning. Either one stops Caddy outright.
      DOMAIN: "${DOMAIN:-localhost}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@localhost}"
      # bcrypt of "demo" — a local convenience only. The deployed instance overrides this from
      # sops (SPEC.md §13); the plaintext passcode is never in the repo.
      DEMO_PASSCODE_HASH: "${DEMO_PASSCODE_HASH:-$$2a$$14$$pKTcuJ.wurPLeZ3eoCdEy.bMTc4YsS7CDSJMweHTd.Xd9klXsW3n6}"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../console/build:/srv/console:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    profiles: [full]
    depends_on:
      redpanda: {condition: service_healthy}
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8090:8080"]

volumes:
